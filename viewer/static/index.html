<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>speech-intake viewer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="row">
    <strong class="brand">speech-intake</strong>
    <label title="参照 run の run.json の group（話者の属性）で絞る">群 <select id="group"><option value="">すべて</option></select></label>
    <label>セッション <select id="session"></select></label>
    <label>設定 A <select id="runA"></select></label>
    <label title="別のセッション（例：AirPods と PC のマイク）を B に並べる。latency_pair で録った組は相手が初めから選ばれる">比較のセッション <select id="sessionB"></select></label>
    <label>設定 B（比較） <select id="runB"></select></label>
    <label title="B の時刻 = A の時刻 + この値。既定は録音開始の壁時計の差（session.json の t0_unix）で、同じ瞬間が縦に揃う">B のずらし <input type="number" id="offB" step="1" value="0" disabled> ms</label>
    <button id="offWall" title="録音開始の壁時計の差に戻す" disabled>壁時計で合わせる</button>
    <button id="reload" title="一覧と結果を読み直す">再読込</button>
    <span id="status" class="muted"></span>
  </div>
  <div class="row">
    <label title="VAD 区間（緑の帯）と枠ごとの確率（緑の線）・閾値（点線）"><input type="checkbox" id="tVad" checked> VAD 区間</label>
    <label title="0〜8 kHz。点線は 4 kHz（これより上が空なら狭帯域。段11）"><input type="checkbox" id="tSpec"> スペクトログラム</label>
    <label><input type="checkbox" id="tText" checked> 文字</label>
    <label><input type="checkbox" id="tWords"> 単語時刻</label>
    <label><input type="checkbox" id="tSpk" checked> 話者の色分け</label>
    <label title="単語の確率 p が低いほど濃く塗る（単語時刻の表示中）"><input type="checkbox" id="tWordP"> 単語の p を濃淡で</label>
    <label title="speech_start（緑）・speech_end（橙）・utterance（青）を配信した時刻の印（trace/events.jsonl。段10）"><input type="checkbox" id="tEv" checked> 通知</label>
    <label title="区間ごとの遅れを帯の長さで：始まりの確定（話し始め→speech_start）／終わりの確定（区間の終わり→speech_end）／STT（speech_end→utterance）"><input type="checkbox" id="tLag"> 遅れを帯で</label>
    <span class="legend"><i class="ev-start"></i>始まり <i class="ev-end"></i>終わり <i class="ev-utt"></i>utterance <i class="ev-drop"></i>捨てた <i class="ev-partial"></i>暫定</span>
  </div>
  <div class="row">
    <label title="音素認識器の音素（時刻つき）と、参照の音素（整列後の位置）"><input type="checkbox" id="tPhones" checked> 音素</label>
    <label>表記 <select id="phMode"><option value="ipa">元の IPA</option><option value="cls">粗いクラス</option></select></label>
    <label title="人間の音声転写（ref）か、文字からの辞書変換（ref_g2p）か">参照 <select id="refKind"><option value="ref">human（ref）</option><option value="ref_g2p">g2p（ref_g2p）</option></select></label>
    <span class="legend"><i class="op-match"></i>一致 <i class="op-sub"></i>置換 <i class="op-del"></i>脱落 <i class="op-ins"></i>挿入</span>
    <span class="sep"></span>
    <button id="zoomIn" title="拡大（ホイール）">＋</button>
    <button id="zoomOut" title="縮小（ホイール）">－</button>
    <button id="zoomFit" title="全体を表示">全体</button>
    <button id="play" title="スペースキー">▶ 再生</button>
    <span id="clock" class="mono"></span>
  </div>
</header>
<main>
  <canvas id="ruler" height="24"></canvas>
  <div id="panels"></div>
  <p class="help muted">
    ホイール：拡大縮小／Shift+ホイール・ドラッグ：左右に移動／区間や文字をクリック：その部分を再生／
    波形の何もない所をクリック：そこから再生／スペース：再生・停止／マウスを重ねると元のレコードを表示／
    音素をクリック：その音素の前後だけ再生
  </p>
  <div id="devcheck"></div>
  <div id="aligns"></div>
  <div id="tables"></div>
  <div id="summary"></div>
</main>
<div id="tip" hidden></div>
<audio id="audio" preload="auto"></audio>
<audio id="audioB" preload="auto"></audio>
<script src="/static/app.js"></script>
</body>
</html>
