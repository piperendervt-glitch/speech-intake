  # 二重母音の後半をわたり音（j / w）で書く表記（allosaurus がこう出す）。認識側は語の区切りを持たないので、
  # 語をまたいだ母音＋j/w（例 "the yard" の ə j）もまとめてしまうことがある
  aj: AY
